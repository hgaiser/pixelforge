[package]
name = "pixelforge"
version = "0.11.0"
edition = "2024"
description = "A Vulkan-based video encoding library for Rust"
license = "BSD-2-Clause"
repository = "https://github.com/hgaiser/pixelforge"
keywords = ["vulkan", "video", "encoding", "h264", "h265"]
categories = ["multimedia::video", "graphics"]
readme = "README.md"

[features]
default = []
dmabuf = []

[dependencies]
ash = { git = "https://github.com/ash-rs/ash", rev = "f4c2ca3e4f6b998d5254ad101a32f024d87cdec2", features = ["loaded"] }
futures-channel = { version = "0.3", default-features = false, features = ["std"] }
futures-core = { version = "0.3", default-features = false }
thiserror = "2.0"
tracing = "0.1"

[dev-dependencies]
env_logger = "0.11"
pollster = "1.0"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[[bench]]
name = "encode"
harness = false
