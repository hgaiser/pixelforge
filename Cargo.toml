[package]
name = "pixelforge"
version = "0.14.1"
edition = "2024"
description = "A Vulkan-based video encoding and decoding library for Rust"
license = "BSD-2-Clause"
repository = "https://github.com/hgaiser/pixelforge"
keywords = ["vulkan", "video", "encoding", "decoding", "h264"]
categories = ["multimedia::video", "graphics"]
readme = "README.md"
# Tracked files that a user of the crate does not need. Keep the shaders (the
# compiled one is built in) and `tests/`, whose fixtures the tests embed.
exclude = [
    "/.cargo/",
    "/.github/",
    "/.gitignore",
    "/AGENTS.md",
    "/README.tpl",
    "/assets/",
    "/docs/",
    "/scripts/",
    "/testdata/",
]

[workspace]
members = [".", "tools"]

[features]
default = []
dmabuf = []

[dependencies]
ash = { package = "pixelforge-ash", version = "0.38.1", features = ["loaded"] }
futures-channel = { version = "0.3", default-features = false, features = ["std"] }
futures-core = { version = "0.3", default-features = false }
thiserror = "2.0"
tracing = "0.1"

[dev-dependencies]
env_logger = "0.11"
pollster = "1.0"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[[bench]]
name = "encode"
harness = false
